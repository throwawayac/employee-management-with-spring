spring.application.name=employee-management
# Reads DB_URL, DB_USERNAME and DB_PASSWORD from the git-ignored .env file in the project root
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
# Show the reason (e.g. "Email is already in use") and per-field validation errors in error responses
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
# The DTOs have a primitive boolean isDeleted; let requests leave it out instead of failing with 400
spring.jackson.deserialization.fail-on-null-for-primitives=false
