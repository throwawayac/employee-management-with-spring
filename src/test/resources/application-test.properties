# Used by tests annotated with @ActiveProfiles("test"), on top of src/main/resources/application.properties.
# An in-memory H2 database replaces PostgreSQL. It's created when the tests start and gone when they finish,
# so the tests need neither a database server nor the .env file
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
